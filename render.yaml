services:
  - type: web
    name: roomradar-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: roomradar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ROOMRADAR_DATABASE
        value: /var/data/roomradar.db
      - key: ROOMRADAR_UPLOAD_DIR
        value: /var/data/uploads
      - key: ROOMRADAR_ADMIN_KEY
        generateValue: true
      - key: ROOMRADAR_ALLOWED_ORIGINS
        value: "*"
