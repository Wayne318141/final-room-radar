<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomRadar｜資料管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#172821;--muted:#718078;--green:#285943;--lime:#d9ef9d;--paper:#f7f8f5;--line:#e6eae5;--red:#a94b40}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 26px}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.5px;color:var(--green);text-decoration:none}.top a:last-child{font-size:12px;color:#617066;text-decoration:none}.heading{padding:38px 0 25px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#7a8a80;text-transform:uppercase;font-weight:700}.heading h1{font-size:30px;letter-spacing:-1px;margin:7px 0}.heading p{font-size:12px;color:var(--muted);margin:0}.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.btn-green{background:var(--green);color:white}.btn-light{background:#edf2ec;color:var(--green)}.btn-danger{background:#fff0ed;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:24px}.stat{background:white;border:1px solid var(--line);border-radius:11px;padding:16px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:25px;margin-top:5px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tab{background:transparent;border:0;color:#718078;padding:11px 14px;font-size:12px;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}.tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:700}.panel{background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid #eef1ed}.panel-head h2{font-size:14px;margin:0}.panel-head span{font-size:10px;color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}th{text-align:left;font-weight:700;color:#738078;background:#f8faf7}td,th{padding:12px 14px;border-bottom:1px solid #edf0eb}tbody tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px}.actions .btn{padding:7px 9px;font-size:10px}.empty{text-align:center;padding:45px 15px;color:var(--muted);font-size:12px}.status{font-size:10px;color:var(--green);background:#eaf2e9;border-radius:20px;padding:5px 8px}.modal-bg{display:none;position:fixed;inset:0;background:#10251dd9;z-index:3;align-items:center;justify-content:center;padding:18px}.modal-bg.open{display:flex}.modal{width:min(700px,100%);max-height:92vh;overflow:auto;background:white;border-radius:14px;padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:#eff3ed;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;font-weight:700;color:#526259;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #dfe6df;border-radius:7px;font:inherit;font-size:12px}.field textarea{min-height:65px;resize:vertical}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.notice{color:#6f7e74;font-size:10px;margin:15px 0}.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-12px);opacity:0;background:#203d2e;color:white;border-radius:8px;padding:10px 14px;font-size:11px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}footer{font-size:10px;color:#829087;padding:25px 0 35px}
    @media(max-width:620px){.wrap{padding:0 15px}.heading{align-items:start;gap:10px;flex-direction:column}.heading h1{font-size:25px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:12px}.stat strong{font-size:21px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{height:62px}}
  </style>
</head>
<body>
  <header class="wrap top"><a class="brand" href="./">⌂ RoomRadar　資料管理</a><a href="#api-docs" id="apiDocsLink">開啟 FastAPI API 文件 ↗</a></header>
  <main class="wrap">
    <section class="heading"><div><div class="eyebrow">Database & API workspace</div><h1>資料管理後台</h1><p>檢視資料庫內容，編輯或移除已刊登房源。</p></div><button class="btn btn-green" id="refresh">重新整理資料</button></section>
    <section class="stats" id="stats"></section>
    <nav class="tabs" aria-label="資料表"><button class="tab active" data-tab="listings">房源</button><button class="tab" data-tab="users">使用者</button><button class="tab" data-tab="favorites">收藏紀錄</button><button class="tab" data-tab="posters">海報資料</button></nav>
    <section class="panel"><div class="panel-head"><h2 id="panelTitle">房源資料表</h2><span id="rowCount"></span></div><div class="table-wrap" id="tableContainer"></div></section>
    <p class="notice">這是課程原型管理頁，目前沒有管理員登入保護。請只在本機或可信任的課堂環境使用；正式公開部署前要加入帳號權限。</p>
    <footer>RoomRadar · SQLite 資料管理 · <a href="#api-docs" id="apiDocsFooter">FastAPI 互動式 API 文件</a></footer>
  </main>
  <div class="modal-bg" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="modal"><div class="modal-head"><h2 id="editTitle">編輯房源</h2><button class="close" id="closeEdit" aria-label="關閉">×</button></div><form id="editForm"><input type="hidden" name="id"><div class="form-grid">
    <div class="field wide"><label for="editTitleInput">房源標題</label><input id="editTitleInput" name="title" minlength="4" maxlength="80" required></div>
    <div class="field"><label for="editCity">縣市</label><input id="editCity" name="city" required></div><div class="field"><label for="editDistrict">行政區</label><input id="editDistrict" name="district" required></div>
    <div class="field wide"><label for="editAddress">交通／生活圈</label><input id="editAddress" name="address_area" required></div>
    <div class="field"><label for="editRent">月租（元）</label><input id="editRent" name="monthly_rent" type="number" min="1" required></div><div class="field"><label for="editManagement">管理費（元）</label><input id="editManagement" name="management_fee" type="number" min="0" required></div>
    <div class="field"><label for="editElectricity">每度電費（元，可留空）</label><input id="editElectricity" name="electricity_rate" type="number" min="0.1" step="0.1"></div><div class="field"><label for="editWater">水費（元）</label><input id="editWater" name="water_fee" type="number" min="0" required></div>
    <div class="field"><label for="editInternet">網路費（元）</label><input id="editInternet" name="internet_fee" type="number" min="0" required></div><div class="field"><label for="editRoomType">房型</label><select id="editRoomType" name="room_type"><option>獨立套房</option><option>雅房</option><option>整層住家</option></select></div>
    <div class="field"><label for="editArea">坪數</label><input id="editArea" name="area_ping" type="number" min="0.1" step="0.1" required></div><div class="field"><label for="editFloor">樓層</label><input id="editFloor" name="floor" required></div>
    <div class="field wide"><label for="editEquipment">設備（以逗號分隔）</label><input id="editEquipment" name="equipment"></div><div class="field wide"><label for="editDescription">房源介紹</label><textarea id="editDescription" name="description" minlength="10" maxlength="1000" required></textarea></div>
  </div><div class="modal-actions"><button type="button" class="btn btn-light" id="cancelEdit">取消</button><button type="submit" class="btn btn-green" id="saveEdit">儲存修改</button></div></form></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="config.js"></script>
  <script>
    const API_BASE=(window.ROOMRADAR_API_BASE||'').replace(/\/$/,'');
    const apiUrl=path=>`${API_BASE}${path}`;
    const apiKey=()=>{let key=sessionStorage.getItem('roomradar-admin-key');if(!key){key=prompt('請輸入部署時設定的管理密鑰');if(key)sessionStorage.setItem('roomradar-admin-key',key)}return key||''};
    document.getElementById('apiDocsLink').href=apiUrl('/docs');document.getElementById('apiDocsFooter').href=apiUrl('/docs');
    const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const formatDate=value=>value?new Date(value.replace(' ','T')+'Z').toLocaleString('zh-TW'):'—';
    let data={listings:[],users:[],favorites:[],posters:[],counts:{}},activeTab='listings',toastTimer;
    function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
    async function request(url,options={}){const response=await fetch(apiUrl(url),{headers:{'Content-Type':'application/json','X-Admin-Key':apiKey(),...options.headers},...options});if(response.status===204)return null;const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.detail||'操作失敗');return body}
    async function refreshData(){try{data=await request('/api/admin/overview');renderStats();renderTable()}catch(error){document.getElementById('tableContainer').innerHTML=`<div class="empty">資料讀取失敗：${escapeHTML(error.message)}</div>`}}
    function renderStats(){const labels=[['房源',data.counts.listings],['匿名使用者',data.counts.users],['收藏紀錄',data.counts.favorites],['已上傳海報',data.counts.posters]];document.getElementById('stats').innerHTML=labels.map(([label,count])=>`<article class="stat"><span>${label}</span><strong>${count}</strong></article>`).join('')}
    function table(title,headers,rows){document.getElementById('panelTitle').textContent=title;document.getElementById('rowCount').textContent=`${rows.length} 筆`;if(!rows.length){document.getElementById('tableContainer').innerHTML='<div class="empty">目前沒有資料。</div>';return}document.getElementById('tableContainer').innerHTML=`<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`}
    function renderTable(){if(activeTab==='listings'){table('房源資料表',['ID','房源','地區','房型','月租','海報','建立時間','操作'],data.listings.map(item=>`<tr><td>${item.id}</td><td><b>${escapeHTML(item.title)}</b><br><span style="color:#718078">${escapeHTML(item.address_area)}</span></td><td>${escapeHTML(item.city)} ${escapeHTML(item.district)}</td><td>${escapeHTML(item.room_type)}</td><td>NT$ ${Number(item.monthly_rent).toLocaleString('zh-TW')}</td><td>${item.poster_url?'<span class="status">已上傳</span>':'—'}</td><td>${formatDate(item.created_at)}</td><td><div class="actions"><button class="btn btn-light" data-edit="${item.id}">編輯</button><button class="btn btn-danger" data-delete="${item.id}">刪除</button></div></td></tr>`))}else if(activeTab==='users'){table('使用者資料表',['識別碼','顯示名稱','建立時間','操作'],data.users.map(user=>`<tr><td>${escapeHTML(user.id)}</td><td>${escapeHTML(user.display_name)}</td><td>${formatDate(user.created_at)}</td><td><div class="actions"><button class="btn btn-light" data-edit-user="${escapeHTML(user.id)}">改名稱</button><button class="btn btn-danger" data-delete-user="${escapeHTML(user.id)}">刪除</button></div></td></tr>`))}else if(activeTab==='favorites'){table('收藏資料表',['紀錄 ID','使用者','房源 ID','房源標題','建立時間','操作'],data.favorites.map(item=>`<tr><td>${item.id}</td><td>${escapeHTML(item.display_name)}<br><span style="color:#718078">${escapeHTML(item.user_id)}</span></td><td>${item.listing_id}</td><td>${escapeHTML(item.title)}</td><td>${formatDate(item.created_at)}</td><td><button class="btn btn-danger" data-delete-favorite="${item.id}">移除收藏</button></td></tr>`))}else{table('海報資料表',['房源 ID','房源標題','原始檔名','格式','大小','上傳時間','操作'],data.posters.map(item=>`<tr><td>${item.listing_id}</td><td>${escapeHTML(item.title)}</td><td>${escapeHTML(item.original_name)}</td><td>${escapeHTML(item.content_type)}</td><td>${(item.size/1024).toFixed(1)} KB</td><td>${formatDate(item.uploaded_at)}</td><td><button class="btn btn-danger" data-delete-poster="${item.listing_id}">刪除海報</button></td></tr>`))}}
    function openEdit(id){const item=data.listings.find(x=>x.id===id);if(!item)return;const form=document.getElementById('editForm');for(const [key,value] of Object.entries(item)){const field=form.elements.namedItem(key);if(!field)continue;field.value=key==='equipment'?value.join(', '):value??''}form.elements.electricity_rate.value=item.electricity_rate??'';document.getElementById('editModal').classList.add('open')}
    function closeEdit(){document.getElementById('editModal').classList.remove('open')}
    async function saveListing(event){event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;const raw=Object.fromEntries(new FormData(form));const listingId=Number(raw.id);const payload={title:raw.title,description:raw.description,city:raw.city,district:raw.district,address_area:raw.address_area,monthly_rent:Number(raw.monthly_rent),management_fee:Number(raw.management_fee),electricity_rate:raw.electricity_rate?Number(raw.electricity_rate):null,water_fee:Number(raw.water_fee),internet_fee:Number(raw.internet_fee),room_type:raw.room_type,area_ping:Number(raw.area_ping),floor:raw.floor,equipment:raw.equipment.split(',').map(x=>x.trim()).filter(Boolean)};const button=document.getElementById('saveEdit');button.disabled=true;try{await request(`/api/admin/listings/${listingId}`,{method:'PUT',body:JSON.stringify(payload)});closeEdit();await refreshData();showToast('房源資料已更新')}catch(error){showToast(error.message)}finally{button.disabled=false}}
    async function deleteListing(id){if(!confirm(`確定刪除房源 #${id}？相關收藏與海報紀錄也會刪除。`))return;try{await request(`/api/admin/listings/${id}`,{method:'DELETE'});await refreshData();showToast('房源及相關資料已刪除')}catch(error){showToast(error.message)}}
    async function editUser(id){const user=data.users.find(item=>item.id===id);if(!user)return;const name=prompt('請輸入顯示名稱',user.display_name);if(name===null)return;try{await request(`/api/admin/users/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify({display_name:name})});await refreshData();showToast('使用者名稱已更新')}catch(error){showToast(error.message)}}
    async function deleteUser(id){if(!confirm('刪除此使用者及其收藏紀錄？'))return;try{await request(`/api/admin/users/${encodeURIComponent(id)}`,{method:'DELETE'});await refreshData();showToast('使用者及相關收藏已刪除')}catch(error){showToast(error.message)}}
    async function deleteFavorite(id){if(!confirm('移除這筆收藏紀錄？'))return;try{await request(`/api/admin/favorites/${id}`,{method:'DELETE'});await refreshData();showToast('收藏紀錄已移除')}catch(error){showToast(error.message)}}
    async function deletePoster(id){if(!confirm('刪除此房源的海報檔案與資料？'))return;try{await request(`/api/listings/${id}/poster`,{method:'DELETE'});await refreshData();showToast('海報及資料已刪除')}catch(error){showToast(error.message)}}
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{activeTab=button.dataset.tab;document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab===button));renderTable()}));document.getElementById('refresh').addEventListener('click',refreshData);document.getElementById('tableContainer').addEventListener('click',event=>{const edit=event.target.closest('[data-edit]');const remove=event.target.closest('[data-delete]');const editUserButton=event.target.closest('[data-edit-user]');const deleteUserButton=event.target.closest('[data-delete-user]');const deleteFavoriteButton=event.target.closest('[data-delete-favorite]');const deletePosterButton=event.target.closest('[data-delete-poster]');if(edit)openEdit(Number(edit.dataset.edit));if(remove)deleteListing(Number(remove.dataset.delete));if(editUserButton)editUser(editUserButton.dataset.editUser);if(deleteUserButton)deleteUser(deleteUserButton.dataset.deleteUser);if(deleteFavoriteButton)deleteFavorite(Number(deleteFavoriteButton.dataset.deleteFavorite));if(deletePosterButton)deletePoster(Number(deletePosterButton.dataset.deletePoster))});document.getElementById('editForm').addEventListener('submit',saveListing);document.getElementById('closeEdit').addEventListener('click',closeEdit);document.getElementById('cancelEdit').addEventListener('click',closeEdit);document.getElementById('editModal').addEventListener('click',event=>{if(event.target.id==='editModal')closeEdit()});refreshData();
  </script>
</body>
</html>
